name: Release Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
      TAG_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Angular environment files
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p src/environments

          cat > src/environments/environment.ts <<EOF
          export const environment = {
              production: false,
              firebase: {
                  apiKey: "${FIREBASE_API_KEY:-}",
                  authDomain: "${FIREBASE_AUTH_DOMAIN:-}",
                  databaseURL: "${FIREBASE_DATABASE_URL:-}",
                  projectId: "${FIREBASE_PROJECT_ID:-}",
                  storageBucket: "${FIREBASE_STORAGE_BUCKET:-}",
                  messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID:-}"
              }
          }
          EOF

          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
              production: true,
              firebase: {
                  apiKey: "${FIREBASE_API_KEY:-}",
                  authDomain: "${FIREBASE_AUTH_DOMAIN:-}",
                  databaseURL: "${FIREBASE_DATABASE_URL:-}",
                  projectId: "${FIREBASE_PROJECT_ID:-}",
                  storageBucket: "${FIREBASE_STORAGE_BUCKET:-}",
                  messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID:-}"
              }
          }
          EOF

      # - name: Set up Chrome
      #   uses: browser-actions/setup-chrome@v1

      # - name: Run tests (headless)
      #   run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build app
        run: npm run build -- --configuration production

      - name: Compute release values
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          DEPLOY_MESSAGE="release ${TAG_NAME} from ${GITHUB_SHA::7} via GitHub Actions"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deploy_message=${DEPLOY_MESSAGE}" >> "$GITHUB_OUTPUT"

      - name: Ensure Firebase token is set
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN secret is not configured."
            exit 1
          fi

      - name: Ensure Firebase config secrets are set for deploy
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          set -euo pipefail
          required=(
            FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN
            FIREBASE_DATABASE_URL
            FIREBASE_PROJECT_ID
            FIREBASE_STORAGE_BUCKET
            FIREBASE_MESSAGING_SENDER_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting -m "${{ steps.vars.outputs.deploy_message }}" --project budgetapp-fcb30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Update package.json version on default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          TARGET_VERSION="${{ steps.vars.outputs.version }}"

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "package.json already at version $TARGET_VERSION; skipping commit."
            exit 0
          fi

          npm pkg set version="$TARGET_VERSION"
          git add package.json

          if git diff --cached --quiet; then
            echo "No package.json changes detected; skipping commit."
            exit 0
          fi

          git commit -m "chore(release): bump app version to $TARGET_VERSION [skip ci]"
          git push origin "$DEFAULT_BRANCH"
