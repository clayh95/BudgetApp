<mat-dialog-actions class="actions">
  <button mat-icon-button [disabled]="!vendorNameControl.value" (click)="save()">
    <mat-icon>save</mat-icon>
  </button>
  <div class="spacer"></div>
  <button mat-icon-button (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</mat-dialog-actions>

<h2 mat-dialog-title>Add Watched Vendor</h2>

<mat-dialog-content>
  <mat-form-field class="watch-field">
    <mat-label>Vendor</mat-label>
    <input #autocompleteInput
      matInput
      [formControl]="vendorNameControl"
      [matAutocomplete]="vendorAutocomplete"
      (focus)="filterVendorOptions()"
      (input)="filterVendorOptions()"
      placeholder="Type vendor name">
    <mat-autocomplete
      #vendorAutocomplete="matAutocomplete" requireSelection>
      <mat-option *ngFor="let option of filteredVendorOptions" [value]="option">
        {{option}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</mat-dialog-content>
